services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: pharus:latest
    ports:
      - "8080:8080"
    volumes:
      - pharus-data:/app/data
      - ./server/themes:/app/themes
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: pharus-agent:latest
    profiles: ["agent"]
    environment:
      PHARUS_SERVER: ws://server:8080/ws/agent
      PHARUS_TOKEN: ${PHARUS_TOKEN:?set PHARUS_TOKEN}
    restart: unless-stopped

volumes:
  pharus-data:
