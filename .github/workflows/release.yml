name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          arch="${t%%-*}"
          mkdir -p out
          if [[ "$t" == *windows* ]]; then
            cp "target/$t/release/pharus-agent.exe" "out/pharus-agent-windows-$arch.exe"
          else
            stage="$(mktemp -d)"
            cp "target/$t/release/pharus-agent" "$stage/"
            tar -czf "out/pharus-agent-linux-$arch.tar.gz" -C "$stage" pharus-agent
            rm "$stage/pharus-agent"
            cp "target/$t/release/pharus" "$stage/"
            cp -r server/themes "$stage/themes"
            cp -r deploy "$stage/deploy"
            tar -czf "out/pharus-linux-$arch.tar.gz" -C "$stage" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Pharus ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
