[package]
name = "pharus-agent"
description = "Pharus monitoring agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pharus-agent"
path = "src/main.rs"

[dependencies]
pharus-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "gzip"] }
futures-util = "0.3"
sysinfo = "0.33"
x509-parser = "0.17"
webpki-roots = "0.26"
bollard = "0.17"
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
# Connection counts on Windows use netstat2 (GetExtendedTcpTable). Linux
# parses /proc/net instead, because netstat2's Linux backend does not build
# against current glibc.
netstat2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
