<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharus · Demo</title>
  <link rel="stylesheet" href="style.css?v=0.6.1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 20.5 12h7Z' fill='%23fbbf24'/%3E%3Cpath d='M19.5 13h9L31 44H17Z' fill='none' stroke='%23fbbf24' stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    .demo-badge {
      position: fixed; right: 14px; bottom: 14px; z-index: 50;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(251, 191, 36, .14); border: 1px solid rgba(251, 191, 36, .45);
      color: #fbbf24; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="beacon" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="beacon-svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g class="beacon-sweep">
            <path d="M24 9 L46 4 L46 14 Z" fill="url(#beam)"/>
          </g>
          <path d="M24 3 L20.5 12 h7 Z" fill="#fbbf24"/>
          <path d="M19.5 13 h9 L31 44 H17 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19 22 h10 M18 32 h12" stroke="#fbbf24" stroke-width="1.4" opacity="0.45"/>
          <circle cx="24" cy="17.5" r="2.2" fill="#fde68a"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Pharus</h1>
        <p data-i18n="brand.subtitle">Lighthouse · Lightweight Server Monitoring</p>
      </div>
      <div class="header-right">
        <button id="admin-btn" class="icon-btn" hidden data-i18n-aria="admin.manage" aria-label="Admin mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <span id="conn" class="conn-badge conn-down" role="status">
          <span class="conn-dot"></span>Connecting…
        </span>
      </div>
    </div>
  </header>

  <main class="wrap main">

    <section class="stats" aria-label="总览">
      <div class="stat-tile">
        <p class="stat-label" data-i18n="stats.total">Servers</p>
        <p class="stat-value" id="stat-total">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label" data-i18n="stats.online">Online</p>
        <p class="stat-value stat-online" id="stat-online">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label" data-i18n="stats.offline">Offline</p>
        <p class="stat-value stat-offline" id="stat-offline">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label" data-i18n="stats.avgCpu">Avg CPU</p>
        <p class="stat-value stat-cpu" id="stat-cpu">—</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label" data-i18n="stats.monthlyCost">Monthly cost</p>
        <p class="stat-value stat-cost" id="stat-cost">—</p>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <p class="empty-title" data-i18n="empty.title">No servers yet</p>
      <p class="empty-hint">
        <span data-i18n="empty.hintBefore">Run</span>
        <code>pharus add-agent --name &lt;name&gt;</code>
        <span data-i18n="empty.hintAfter">to register your first server</span>
      </p>
    </div>
  </main>

  <div class="demo-badge">DEMO · mock data · admin token: demo</div>

  <template id="card-tpl">
    <article class="card is-offline">
      <div class="card-head">
        <div class="card-title">
          <h2 data-f="name">—</h2>
          <p data-f="os">—</p>
        </div>
        <span class="status-pill" data-f="status"><span class="dot"></span>Offline</span>
      </div>

      <div class="card-body">
        <div class="gauge" role="img" data-i18n-aria="gauge.aria" aria-label="CPU usage">
          <svg viewBox="0 0 96 96" class="gauge-svg">
            <defs>
              <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f59e0b"/>
                <stop offset="1" stop-color="#fbbf24"/>
              </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="40" fill="none" stroke-width="7" class="gauge-track"/>
            <circle cx="48" cy="48" r="40" fill="none" stroke="url(#cpuGrad)" stroke-width="7"
                    stroke-linecap="round" class="gauge-arc" data-f="cpuArc"
                    stroke-dasharray="251.33" stroke-dashoffset="251.33"/>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" data-f="cpuVal">—</span>
            <span class="gauge-label" data-i18n="gauge.cpu">CPU</span>
          </div>
        </div>

        <div class="meters">
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.mem">Memory</span>
              <span class="meter-value" data-f="memVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill mem" data-f="memFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.disk">Disk</span>
              <span class="meter-value" data-f="diskVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill disk" data-f="diskFill"></div></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="kv-grid">
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-down"><path d="M8 12.5 2.5 7h3V2h5v5h3z" fill="currentColor"/></svg>
            <span data-i18n="kv.download">Download</span>
          </span>
          <span class="v" data-f="rx">—</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-up"><path d="M8 3.5 13.5 9h-3v5h-5V9h-3z" fill="currentColor"/></svg>
            <span data-i18n="kv.upload">Upload</span>
          </span>
          <span class="v" data-f="tx">—</span>
        </div>
        <div class="kv"><span class="k" data-i18n="kv.load">Load</span><span class="v" data-f="load">—</span></div>
        <div class="kv"><span class="k" data-i18n="kv.uptime">Uptime</span><span class="v" data-f="uptime">—</span></div>
      </div>

      <div class="billing" data-f="billing" hidden>
        <div class="divider"></div>
        <div class="meter">
          <div class="meter-head">
            <span class="meter-label" data-i18n="billing.traffic">Cycle traffic</span>
            <span class="meter-value" data-f="trafficVal">—</span>
          </div>
          <div class="meter-track"><div class="meter-fill traffic" data-f="trafficFill"></div></div>
        </div>
        <div class="kv-grid billing-kv">
          <div class="kv"><span class="k" data-i18n="billing.expires">Expires</span><span class="v" data-f="expires">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.price">Price</span><span class="v" data-f="price">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.resetDay">Reset day</span><span class="v" data-f="resetDay">—</span></div>
          <div class="kv billing-edit-kv"><button class="edit-btn" data-f="editBtn" hidden data-i18n="admin.edit">Edit</button></div>
        </div>
      </div>
    </article>
  </template>

  <div class="modal-mask" id="token-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="admin.login">Admin mode</h3>
        <button class="modal-x" data-close aria-label="Close">×</button>
      </div>
      <label class="field">
        <span data-i18n="admin.token">Admin token</span>
        <input type="password" id="token-input" autocomplete="off" />
      </label>
      <p class="modal-err" id="token-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="token-cancel" data-i18n="admin.cancel">Cancel</button>
        <button class="btn primary" id="token-submit" data-i18n="admin.submit">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="edit-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="edit-title">Edit</h3>
        <button class="modal-x" data-close aria-label="Close">×</button>
      </div>
      <label class="field">
        <span data-i18n="admin.resetDay">Monthly reset day</span>
        <input type="number" id="f-reset-day" min="1" max="31" />
      </label>
      <label class="field">
        <span data-i18n="admin.quotaGb">Traffic quota (GiB)</span>
        <input type="number" id="f-quota-gb" min="0" step="1" />
      </label>
      <label class="field">
        <span data-i18n="admin.expiresOn">Expiry date</span>
        <input type="date" id="f-expires-on" />
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="admin.price">Price</span>
          <input type="number" id="f-price" min="0" step="0.01" />
        </label>
        <label class="field">
          <span data-i18n="admin.currency">Currency</span>
          <select id="f-currency">
            <option value="">—</option>
            <option value="CNY">CNY ¥</option>
            <option value="USD">USD $</option>
            <option value="EUR">EUR €</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="admin.cycle">Cycle</span>
          <select id="f-cycle">
            <option value="">—</option>
            <option value="monthly" data-i18n="billing.cycle.monthly">monthly</option>
            <option value="quarterly" data-i18n="billing.cycle.quarterly">quarterly</option>
            <option value="yearly" data-i18n="billing.cycle.yearly">yearly</option>
          </select>
        </label>
      </div>
      <p class="modal-err" id="edit-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="edit-cancel" data-i18n="admin.cancel">Cancel</button>
        <button class="btn primary" id="edit-save" data-i18n="admin.save">Save</button>
      </div>
    </div>
  </div>

  <!-- Mock transport: replaces WebSocket/fetch before app.js loads -->
  <script>
    (function () {
      var AGENT_ID = 1;
      var started = Date.now();
      var GiB = 1024 * 1024 * 1024;

      var cycleStart = (function () {
        var d = new Date();
        return Math.floor(new Date(d.getFullYear(), d.getMonth(), 1).getTime() / 1000);
      })();

      var state = {
        cpu: 35,
        memUsed: 3.2 * GiB,
        memTotal: 8 * GiB,
        swapUsed: 128 * 1024 * 1024,
        swapTotal: 2 * GiB,
        diskUsed: 46 * GiB,
        diskTotal: 160 * GiB,
        rx: 1.5 * 1024 * 1024,
        tx: 700 * 1024,
        load: 0.8,
        trafficRx: 412 * GiB,
        trafficTx: 96 * GiB
      };

      var billing = {
        reset_day: 1,
        quota_bytes: 1024 * GiB,
        expires_at: Math.floor(Date.now() / 1000) + 26 * 86400,
        price: 35,
        currency: 'CNY',
        cycle: 'monthly'
      };

      function traffic() {
        return { cycle_start: cycleStart, rx_bytes: Math.round(state.trafficRx), tx_bytes: Math.round(state.trafficTx) };
      }

      function walk(v, step, min, max) {
        v += (Math.random() - 0.5) * 2 * step;
        return Math.max(min, Math.min(max, v));
      }

      function metrics() {
        state.cpu = walk(state.cpu, 7, 2, 97);
        state.memUsed = walk(state.memUsed, 80 * 1024 * 1024, 1 * GiB, state.memTotal * 0.93);
        state.swapUsed = walk(state.swapUsed, 4 * 1024 * 1024, 0, state.swapTotal * 0.6);
        state.diskUsed = walk(state.diskUsed, 2 * 1024 * 1024, 30 * GiB, state.diskTotal * 0.95);
        state.rx = walk(state.rx, 900 * 1024, 10 * 1024, 60 * 1024 * 1024);
        state.tx = walk(state.tx, 500 * 1024, 5 * 1024, 25 * 1024 * 1024);
        state.load = walk(state.load, 0.25, 0.05, 6);
        state.trafficRx += state.rx;
        state.trafficTx += state.tx;
        return {
          cpu_usage: state.cpu,
          mem_used: Math.round(state.memUsed),
          mem_total: state.memTotal,
          swap_used: Math.round(state.swapUsed),
          swap_total: state.swapTotal,
          disk_used: Math.round(state.diskUsed),
          disk_total: state.diskTotal,
          net_rx_bps: Math.round(state.rx),
          net_tx_bps: Math.round(state.tx),
          load1: state.load,
          uptime: Math.floor((Date.now() - started) / 1000) + 13 * 86400 + 7 * 3600,
          net_rx_total: Math.round(state.trafficRx),
          net_tx_total: Math.round(state.trafficTx)
        };
      }

      var snapshot = {
        type: 'snapshot',
        agents: [{
          agent_id: AGENT_ID,
          name: 'demo-vps-tokyo',
          online: true,
          info: {
            hostname: 'demo-vps-tokyo',
            os: 'Debian GNU/Linux 12 (bookworm)',
            kernel: '6.1.0-26-amd64',
            arch: 'x86_64',
            cpu_model: 'AMD EPYC 7543P 32-Core Processor',
            cpu_cores: 4,
            virtualization: 'kvm'
          },
          data: metrics(),
          billing: billing,
          traffic: traffic()
        }]
      };

      var tickCount = 0;
      function MockWebSocket(url) {
        var self = this;
        self.readyState = 0;
        setTimeout(function () {
          self.readyState = 1;
          if (self.onopen) self.onopen({});
        }, 150);
        setTimeout(function () {
          if (self.onmessage) self.onmessage({ data: JSON.stringify(snapshot) });
          setInterval(function () {
            if (!self.onmessage) return;
            self.onmessage({
              data: JSON.stringify({ type: 'metrics', agent_id: AGENT_ID, online: true, data: metrics() })
            });
            // push updated period traffic every ~5s, like the server does after flushes
            if (++tickCount % 5 === 0) {
              self.onmessage({
                data: JSON.stringify({ type: 'billing', agent_id: AGENT_ID, billing: billing, traffic: traffic() })
              });
            }
          }, 1000);
        }, 400);
      }
      MockWebSocket.prototype.close = function () { this.readyState = 3; };
      MockWebSocket.prototype.send = function () {};
      window.WebSocket = MockWebSocket;

      // mock admin API (token: demo)
      var realFetch = window.fetch.bind(window);
      window.fetch = function (url, opts) {
        if (typeof url !== 'string' || url.indexOf('/api/admin/') !== 0) {
          return realFetch(url, opts);
        }
        opts = opts || {};
        var auth = (opts.headers && opts.headers.Authorization) || '';
        if (url === '/api/admin/check') {
          return Promise.resolve(new Response('', { status: auth === 'Bearer demo' ? 200 : 401 }));
        }
        if (url.indexOf('/api/admin/agents/') === 0 && opts.method === 'PUT') {
          if (auth !== 'Bearer demo') {
            return Promise.resolve(new Response(JSON.stringify({ error: 'invalid admin token' }), { status: 401 }));
          }
          var body = JSON.parse(opts.body || '{}');
          billing = {
            reset_day: body.reset_day,
            quota_bytes: body.quota_gb != null ? Math.round(body.quota_gb * GiB) : null,
            expires_at: body.expires_on ? Math.floor(new Date(body.expires_on + 'T00:00:00').getTime() / 1000) : null,
            price: body.price,
            currency: body.currency,
            cycle: body.cycle
          };
          console.log('[demo] billing updated:', billing);
          return Promise.resolve(new Response(JSON.stringify({ billing: billing, traffic: traffic() }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }
        return Promise.resolve(new Response('not found', { status: 404 }));
      };
    })();
  </script>
  <script src="app.js?v=0.6.1"></script>
</body>
</html>
