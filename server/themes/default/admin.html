<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="doc.title.admin">Pharus · Admin</title>
  <link rel="stylesheet" href="style.css?v=0.6.1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 20.5 12h7Z' fill='%23fbbf24'/%3E%3Cpath d='M19.5 13h9L31 44H17Z' fill='none' stroke='%23fbbf24' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="beacon" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="beacon-svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g class="beacon-sweep">
            <path d="M24 9 L46 4 L46 14 Z" fill="url(#beam)"/>
          </g>
          <path d="M24 3 L20.5 12 h7 Z" fill="#fbbf24"/>
          <path d="M19.5 13 h9 L31 44 H17 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19 22 h10 M18 32 h12" stroke="#fbbf24" stroke-width="1.4" opacity="0.45"/>
          <circle cx="24" cy="17.5" r="2.2" fill="#fde68a"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Pharus</h1>
        <p data-i18n="brand.subtitle">Lighthouse · Lightweight Server Monitoring</p>
      </div>
      <div class="header-right">
        <a class="nav-back" href="index" data-i18n="nav.hosts">← 主机列表</a>
        <button id="theme-btn" class="view-toggle" type="button" data-i18n="theme.auto">auto</button>
        <button id="logout-btn" class="view-toggle" type="button" hidden data-i18n="admin.logout">退出登录</button>
        <span id="conn" class="conn-badge conn-down" role="status">
          <span class="conn-dot"></span>Connecting…
        </span>
      </div>
    </div>
  </header>

  <main class="wrap main">

    <!-- login -->
    <section class="admin-login" id="login-view" hidden>
      <div class="admin-login-card">
        <h2 data-i18n="admin.login">管理员登录</h2>
        <p class="admin-login-hint" data-i18n="admin.loginHint">输入管理员账号进入管理中心</p>
        <label class="field">
          <span data-i18n="admin.username">用户名</span>
          <input type="text" id="login-username" autocomplete="username" />
        </label>
        <label class="field">
          <span data-i18n="admin.password">密码</span>
          <input type="password" id="login-password" autocomplete="current-password" />
        </label>
        <p class="modal-err" id="login-err" hidden></p>
        <div class="modal-actions">
          <a class="btn ghost" href="index" data-i18n="admin.cancel">取消</a>
          <button class="btn primary" id="login-submit" data-i18n="admin.submit">确定</button>
        </div>
      </div>
    </section>

    <!-- admin workspace -->
    <section class="admin-panel" id="admin-root" hidden>
      <div class="admin-tabs" role="navigation" aria-label="管理页面">
        <button class="admin-tab active" type="button" data-admin-view="alerts" data-i18n="admin.alerts">告警规则</button>
        <button class="admin-tab" type="button" data-admin-view="channels" data-i18n="admin.channels">通知渠道</button>
        <button class="admin-tab" type="button" data-admin-view="pingTasks" data-i18n="admin.pingTasks">Ping 任务</button>
        <button class="admin-tab" type="button" data-admin-view="tasks" data-i18n="admin.tasks">自定义任务</button>
        <button class="admin-tab" type="button" data-admin-view="regions" data-i18n="admin.regions">区域设置</button>
        <button class="admin-tab" type="button" data-admin-view="features" data-i18n="admin.features">功能开关</button>
        <button class="admin-tab" type="button" data-admin-view="hostBilling" data-i18n="admin.hostBilling">主机账单</button>
        <button class="admin-tab" type="button" data-admin-view="streamingDetect" data-i18n="admin.streaming">流媒体检测</button>
        <button class="admin-tab" type="button" data-admin-view="iperf3Log" data-i18n="admin.iperf3Log">iPerf3 记录</button>
        <button class="admin-tab" type="button" data-admin-view="themes" data-i18n="admin.themes">主题</button>
        <button class="admin-tab" type="button" data-admin-view="settings" data-i18n="admin.settings">站点设置</button>
        <button class="admin-tab" type="button" data-admin-view="updates" data-i18n="admin.updates">在线更新</button>
      </div>
      <p class="panel-message error" id="admin-error" role="alert" hidden></p>
      <div id="admin-content"></div>
    </section>

    <section class="admin-login" id="disabled-view" hidden>
      <div class="admin-login-card">
        <h2 data-i18n="admin.disabled">管理未启用</h2>
        <p data-i18n="admin.disabledHint">服务器未设置 PHARUS_ADMIN_PASSWORD，管理接口不可用。</p>
        <div class="modal-actions"><a class="btn ghost" href="index" data-i18n="admin.cancel">返回</a></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      <a href="https://github.com/pharus-monitor/pharus" target="_blank" rel="noopener">Pharus</a>
      <span data-i18n="footer.rights">· 轻量服务器监控</span>
    </p>
  </footer>

  <div class="modal-mask" id="entity-modal" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <h3 id="entity-title">—</h3>
        <button class="modal-x" data-close data-i18n-aria="common.close" aria-label="关闭">×</button>
      </div>
      <form id="entity-form">
        <div id="entity-fields"></div>
        <p class="modal-err" id="entity-err" hidden></p>
        <div class="modal-actions">
          <button class="btn ghost" id="entity-cancel" type="button" data-i18n="admin.cancel">取消</button>
          <button class="btn primary" id="entity-save" type="submit" data-i18n="admin.save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="common.js?v=0.6.1"></script>
  <script src="admin.js?v=0.6.1"></script>
  <script>
    (function () {
      'use strict';
      var P = window.Pharus;
      var loginView = document.getElementById('login-view');
      var disabledView = document.getElementById('disabled-view');
      var adminRoot = document.getElementById('admin-root');
      var loginUsername = document.getElementById('login-username');
      var loginPassword = document.getElementById('login-password');
      var loginErr = document.getElementById('login-err');
      var loginSubmit = document.getElementById('login-submit');
      var logoutBtn = document.getElementById('logout-btn');
      var adminController = null;
      var agentsMap = new Map();

      function adminRequest(url, options) {
        options = options || {};
        // The admin session is an HttpOnly cookie; no token is stored in JS.
        return fetch(url, {
          method: options.method || 'GET',
          headers: options.headers || {},
          body: options.body
        }).then(function (response) {
          return response.text().then(function (text) {
            var body = null;
            if (text) {
              try { body = JSON.parse(text); } catch (e) { body = null; }
            }
            if (response.status === 401) {
              logout();
              throw new Error(P.t('admin.unauthorized'));
            }
            if (!response.ok) throw new Error((body && body.error) || ('HTTP ' + response.status));
            return body || {};
          });
        });
      }

      function checkSession() {
        return fetch('/api/admin/check', { method: 'POST' })
          .then(function (r) { return r.status; }).catch(function () { return 0; });
      }

      function doLogin(username, password) {
        return fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        }).then(function (r) {
          return r.json().then(function (body) { return { status: r.status, body: body }; });
        }).catch(function () { return { status: 0, body: {} }; });
      }

      function enterAdmin() {
        document.body.classList.add('is-admin');
        logoutBtn.hidden = false;
        loginView.hidden = true;
        adminRoot.hidden = false;
        if (!adminController) {
          adminController = window.PharusAdmin.create({
            root: adminRoot,
            content: document.getElementById('admin-content'),
            error: document.getElementById('admin-error'),
            modal: document.getElementById('entity-modal'),
            form: document.getElementById('entity-form'),
            fields: document.getElementById('entity-fields'),
            title: document.getElementById('entity-title'),
            formError: document.getElementById('entity-err'),
            t: P.t,
            request: adminRequest,
            getAgents: function () { return Array.from(agentsMap.entries()); },
            hasFeature: P.hasFeature
          });
        }
        adminController.setVisible(true);
      }

      function logout() {
        fetch('/api/admin/logout', { method: 'POST' }).catch(function () {});
        document.body.classList.remove('is-admin');
        logoutBtn.hidden = true;
        if (adminController) { adminController.setVisible(false); }
        adminRoot.hidden = true;
        loginUsername.value = '';
        loginPassword.value = '';
        loginErr.hidden = true;
        loginView.hidden = false;
      }

      function boot() {
        P.initTheme();
        // Sessions are HttpOnly cookies now; purge tokens stored by older versions.
        localStorage.removeItem('pharus.admin');
        sessionStorage.removeItem('pharus.admin');
        // keep a live agent list so feature/region choices can reflect current state
        P.connectStream(function (msg) {
          if (msg.type === 'snapshot') {
            msg.agents.forEach(function (a) {
              agentsMap.set(a.agent_id, {
                name: a.name,
                features: Array.isArray(a.features) ? a.features.slice() : null,
                region: a.region || null
              });
            });
          } else if (msg.type === 'features_update') {
            var f = agentsMap.get(msg.agent_id) || {};
            f.features = Array.isArray(msg.features) ? msg.features.slice() : [];
            agentsMap.set(msg.agent_id, f);
          } else if (msg.type === 'region_update') {
            var g = agentsMap.get(msg.agent_id) || {};
            g.region = msg.region || null;
            agentsMap.set(msg.agent_id, g);
          }
        });

        P.fetchMeta().then(function (meta) {
          if (!meta || !meta.admin_enabled) {
            loginView.hidden = true;
            disabledView.hidden = false;
            return;
          }
          checkSession().then(function (st) {
            if (st === 200) enterAdmin();
            else {
              loginView.hidden = false;
              loginUsername.focus();
            }
          });
        });
      }

      loginSubmit.addEventListener('click', function () {
        var u = loginUsername.value.trim();
        var p = loginPassword.value;
        if (!u || !p) return;
        loginSubmit.disabled = true;
        doLogin(u, p).then(function (res) {
          loginSubmit.disabled = false;
          if (res.status === 200) {
            enterAdmin();
          } else {
            loginErr.textContent = P.t('admin.unauthorized');
            loginErr.hidden = false;
          }
        });
      });
      function loginKey(ev) {
        if (ev.key === 'Enter') loginSubmit.click();
      }
      loginUsername.addEventListener('keydown', loginKey);
      loginPassword.addEventListener('keydown', loginKey);
      logoutBtn.addEventListener('click', logout);
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') {
          document.getElementById('entity-modal').hidden = true;
        }
      });

      P.ready().then(boot);
    })();
  </script>
</body>
</html>
