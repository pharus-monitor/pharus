<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharus · 服务器监控</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 20.5 12h7Z' fill='%23fbbf24'/%3E%3Cpath d='M19.5 13h9L31 44H17Z' fill='none' stroke='%23fbbf24' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="beacon" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="beacon-svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g class="beacon-sweep">
            <path d="M24 9 L46 4 L46 14 Z" fill="url(#beam)"/>
          </g>
          <path d="M24 3 L20.5 12 h7 Z" fill="#fbbf24"/>
          <path d="M19.5 13 h9 L31 44 H17 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19 22 h10 M18 32 h12" stroke="#fbbf24" stroke-width="1.4" opacity="0.45"/>
          <circle cx="24" cy="17.5" r="2.2" fill="#fde68a"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Pharus</h1>
        <p>灯塔 · 轻量服务器监控</p>
      </div>
      <div class="header-right">
        <span id="conn" class="conn-badge conn-down" role="status">
          <span class="conn-dot"></span>连接中…
        </span>
      </div>
    </div>
  </header>

  <main class="wrap main">

    <section class="stats" aria-label="总览">
      <div class="stat-tile">
        <p class="stat-label">主机总数</p>
        <p class="stat-value" id="stat-total">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label">在线</p>
        <p class="stat-value stat-online" id="stat-online">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label">离线</p>
        <p class="stat-value stat-offline" id="stat-offline">0</p>
      </div>
      <div class="stat-tile">
        <p class="stat-label">平均 CPU</p>
        <p class="stat-value stat-cpu" id="stat-cpu">—</p>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <p class="empty-title">暂无主机</p>
      <p class="empty-hint">使用 <code>pharus add-agent --name &lt;名称&gt;</code> 注册第一台服务器</p>
    </div>
  </main>

  <template id="card-tpl">
    <article class="card is-offline">
      <div class="card-head">
        <div class="card-title">
          <h2 data-f="name">—</h2>
          <p data-f="os">—</p>
        </div>
        <span class="status-pill" data-f="status"><span class="dot"></span>离线</span>
      </div>

      <div class="card-body">
        <div class="gauge" role="img" aria-label="CPU 使用率">
          <svg viewBox="0 0 96 96" class="gauge-svg">
            <defs>
              <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f59e0b"/>
                <stop offset="1" stop-color="#fbbf24"/>
              </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="40" fill="none" stroke-width="7" class="gauge-track"/>
            <circle cx="48" cy="48" r="40" fill="none" stroke="url(#cpuGrad)" stroke-width="7"
                    stroke-linecap="round" class="gauge-arc" data-f="cpuArc"
                    stroke-dasharray="251.33" stroke-dashoffset="251.33"/>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" data-f="cpuVal">—</span>
            <span class="gauge-label">CPU</span>
          </div>
        </div>

        <div class="meters">
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label">内存</span>
              <span class="meter-value" data-f="memVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill mem" data-f="memFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label">磁盘</span>
              <span class="meter-value" data-f="diskVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill disk" data-f="diskFill"></div></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="kv-grid">
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-down"><path d="M8 12.5 2.5 7h3V2h5v5h3z" fill="currentColor"/></svg>
            下载
          </span>
          <span class="v" data-f="rx">—</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-up"><path d="M8 3.5 13.5 9h-3v5h-5V9h-3z" fill="currentColor"/></svg>
            上传
          </span>
          <span class="v" data-f="tx">—</span>
        </div>
        <div class="kv"><span class="k">负载</span><span class="v" data-f="load">—</span></div>
        <div class="kv"><span class="k">在线时长</span><span class="v" data-f="uptime">—</span></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
