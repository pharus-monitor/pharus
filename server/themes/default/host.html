<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="doc.title.host">Pharus · Host</title>
  <link rel="stylesheet" href="style.css?v=0.4.1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 20.5 12h7Z' fill='%23fbbf24'/%3E%3Cpath d='M19.5 13h9L31 44H17Z' fill='none' stroke='%23fbbf24' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="beacon" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="beacon-svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g class="beacon-sweep">
            <path d="M24 9 L46 4 L46 14 Z" fill="url(#beam)"/>
          </g>
          <path d="M24 3 L20.5 12 h7 Z" fill="#fbbf24"/>
          <path d="M19.5 13 h9 L31 44 H17 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19 22 h10 M18 32 h12" stroke="#fbbf24" stroke-width="1.4" opacity="0.45"/>
          <circle cx="24" cy="17.5" r="2.2" fill="#fde68a"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Pharus</h1>
        <p data-i18n="brand.subtitle">Lighthouse · Lightweight Server Monitoring</p>
      </div>
      <div class="header-right">
        <a class="nav-back" href="index.html" data-i18n="nav.hosts">← 主机列表</a>
        <button id="theme-btn" class="view-toggle" type="button" data-i18n="theme.auto">auto</button>
        <button id="edit-mode-btn" class="view-toggle" type="button" hidden data-i18n="admin.edit">编辑</button>
        <a id="admin-link" class="admin-link" href="admin.html" hidden data-i18n="nav.admin">管理</a>
        <span id="conn" class="conn-badge conn-down" role="status">
          <span class="conn-dot"></span>Connecting…
        </span>
      </div>
    </div>
  </header>

  <main class="wrap main">

    <div id="host-card" class="host-card"></div>

    <section class="hw-panel" id="hw-panel" hidden>
      <div class="panel-head">
        <div>
          <h2 data-i18n="host.hardware">硬件信息</h2>
          <p data-i18n="host.hardwareSub">CPU、内存与系统概览</p>
        </div>
      </div>
      <div class="hw-grid" id="hw-grid"></div>
    </section>

    <div class="feature-grid" id="feature-grid">

      <section class="feature-panel" id="ping-panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="ping.title">延迟历史</h2>
            <p data-i18n="ping.subtitle">平均往返延迟与丢包趋势</p>
          </div>
          <button class="btn" id="add-task-btn" type="button" hidden data-i18n="host.addPingTask">添加任务</button>
        </div>
        <div class="panel-controls">
          <label class="field compact">
            <span data-i18n="ping.task">探测任务</span>
            <select id="ping-task"><option value="" data-i18n="ping.allTasks">全部任务</option></select>
          </label>
          <label class="field compact">
            <span data-i18n="common.range">时间范围</span>
            <select id="ping-range">
              <option value="1h" selected data-i18n="range.1h">1 小时</option>
              <option value="6h" data-i18n="range.6h">6 小时</option>
              <option value="24h" data-i18n="range.24h">24 小时</option>
              <option value="7d" data-i18n="range.7d">7 天</option>
            </select>
          </label>
        </div>
        <p class="panel-message" id="ping-message" role="status"></p>
        <div class="chart-wrap" id="ping-chart-wrap">
          <canvas id="ping-chart" role="img" data-i18n-aria="ping.chartAria" aria-label="延迟历史折线图"></canvas>
          <div class="chart-tip" id="ping-tip" hidden></div>
          <div class="ping-guide" id="ping-guide" hidden></div>
        </div>
        <div class="chart-legend" id="ping-legend"></div>
        <div class="loss-summary" id="ping-loss"></div>
      </section>

      <section class="feature-panel" id="diag-panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="diag.title">网络诊断</h2>
            <p data-i18n="diag.subtitle">Looking Glass 与 MTR 流式输出</p>
          </div>
        </div>
        <div class="panel-controls diag-controls">
          <label class="field compact target-field">
            <span data-i18n="diag.target">目标地址</span>
            <input id="diag-target" type="text" inputmode="url" placeholder="example.com / 1.1.1.1" data-i18n-placeholder="diag.targetPlaceholder" />
          </label>
          <label class="field compact cycles-field">
            <span data-i18n="diag.cycles">MTR 次数</span>
            <input id="diag-cycles" type="number" min="1" max="100" value="10" />
          </label>
        </div>
        <div class="panel-actions diag-actions">
          <button class="btn" id="diag-ping" type="button" data-i18n="diag.ping">Ping</button>
          <button class="btn" id="diag-traceroute" type="button" data-i18n="diag.traceroute">路由追踪</button>
          <button class="btn" id="diag-mtr" type="button" data-i18n="diag.mtr">MTR</button>
        </div>
        <p class="panel-message error" id="diag-error" role="alert" hidden></p>
        <div class="diag-sessions" id="diag-sessions"></div>
        <p class="panel-message" id="diag-empty" data-i18n="diag.empty">尚未运行诊断</p>
      </section>

      <section class="feature-panel feature-wide" id="streaming-panel">
        <div class="panel-head panel-head-inline">
          <div>
            <h2 data-i18n="streaming.title">流媒体检测</h2>
            <p data-i18n="streaming.subtitle">查看服务可用性与解锁状态</p>
          </div>
        </div>
        <p class="panel-message" id="streaming-message" role="status"></p>
        <div class="service-results" id="streaming-results"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p>
      <a href="https://github.com/pharus-monitor/pharus" target="_blank" rel="noopener">Pharus</a>
      <span data-i18n="footer.rights">· 轻量服务器监控</span>
    </p>
  </footer>

  <template id="card-tpl">
    <article class="card is-offline">
      <div class="card-head">
        <div class="card-title">
          <div class="host-name-row">
            <h2 data-f="name">—</h2>
            <button class="rename-ic" id="rename-btn" type="button" hidden aria-label="改名" title="改名" data-i18n-aria="admin.rename">✏️</button>
          </div>
          <p data-f="os">—</p>
          <div class="ip-row">
            <div class="ip-list">
              <span class="ip-value" data-f="ips4"></span>
              <span class="ip-value" data-f="ips6"></span>
            </div>
            <button class="eye-btn" data-f="ipsToggle" type="button" hidden data-i18n-aria="host.showIp" aria-label="显示 IP" title="显示 IP">👁</button>
          </div>
        </div>
        <div class="card-badges">
          <span class="region-pill" data-f="region" hidden></span>
          <span class="status-pill" data-f="status"><span class="dot"></span>Offline</span>
        </div>
      </div>

      <div class="card-body">
        <div class="gauge" role="img" data-i18n-aria="gauge.aria" aria-label="CPU usage">
          <svg viewBox="0 0 96 96" class="gauge-svg">
            <defs>
              <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f59e0b"/>
                <stop offset="1" stop-color="#fbbf24"/>
              </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="40" fill="none" stroke-width="7" class="gauge-track"/>
            <circle cx="48" cy="48" r="40" fill="none" stroke="url(#cpuGrad)" stroke-width="7"
                    stroke-linecap="round" class="gauge-arc" data-f="cpuArc"
                    stroke-dasharray="251.33" stroke-dashoffset="251.33"/>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" data-f="cpuVal">—</span>
            <span class="gauge-label" data-i18n="gauge.cpu">CPU</span>
          </div>
        </div>

        <div class="meters">
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.mem">Memory</span>
              <span class="meter-value" data-f="memVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill mem" data-f="memFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.swap">Swap</span>
              <span class="meter-value" data-f="swapVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill swap" data-f="swapFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.disk">Disk</span>
              <span class="meter-value" data-f="diskVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill disk" data-f="diskFill"></div></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="kv-grid">
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-down"><path d="M8 12.5 2.5 7h3V2h5v5h3z" fill="currentColor"/></svg>
            <span data-i18n="kv.download">Download</span>
          </span>
          <span class="v" data-f="rx">—</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-up"><path d="M8 3.5 13.5 9h-3v5h-5V9h-3z" fill="currentColor"/></svg>
            <span data-i18n="kv.upload">Upload</span>
          </span>
          <span class="v" data-f="tx">—</span>
        </div>
        <div class="kv"><span class="k" data-i18n="kv.load">Load</span><span class="v" data-f="load">—</span></div>
        <div class="kv"><span class="k" data-i18n="kv.uptime">Uptime</span><span class="v" data-f="uptime">—</span></div>
      </div>

      <div class="billing" data-f="billing" hidden>
        <div class="divider"></div>
        <div class="meter">
          <div class="meter-head">
            <span class="meter-label" data-i18n="billing.traffic">Cycle traffic</span>
            <span class="meter-value" data-f="trafficVal">—</span>
          </div>
          <div class="meter-track"><div class="meter-fill traffic" data-f="trafficFill"></div></div>
        </div>
        <div class="kv-grid billing-kv">
          <div class="kv"><span class="k" data-i18n="billing.expires">Expires</span><span class="v" data-f="expires">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.price">Price</span><span class="v" data-f="price">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.resetDay">Reset day</span><span class="v" data-f="resetDay">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.bandwidth">带宽</span><span class="v" data-f="bandwidth">—</span></div>
        </div>
        <div class="billing-actions">
          <button class="btn" type="button" data-f="editBtn" hidden data-i18n="admin.editBilling">编辑账单</button>
        </div>
      </div>

      <div data-f="pingSection" hidden>
        <div class="divider"></div>
        <div class="mini-head"><span data-i18n="ping.current">当前延迟</span></div>
        <div class="result-chips" data-f="pings"></div>
      </div>

      <div data-f="unlockSection" hidden>
        <div class="divider"></div>
        <div class="mini-head"><span data-i18n="streaming.current">流媒体状态</span></div>
        <div class="result-chips" data-f="unlock"></div>
      </div>
    </article>
  </template>

  <div class="modal-mask" id="token-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="admin.login">管理模式</h3>
        <button class="modal-x" data-close data-i18n-aria="common.close" aria-label="关闭">×</button>
      </div>
      <label class="field">
        <span data-i18n="admin.username">用户名</span>
        <input type="text" id="token-username" autocomplete="username" />
      </label>
      <label class="field">
        <span data-i18n="admin.password">密码</span>
        <input type="password" id="token-input" autocomplete="current-password" />
      </label>
      <p class="modal-err" id="token-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="token-cancel" data-i18n="admin.cancel">取消</button>
        <button class="btn primary" id="token-submit" data-i18n="admin.submit">确定</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="edit-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="edit-title">编辑</h3>
        <button class="modal-x" data-close data-i18n-aria="common.close" aria-label="关闭">×</button>
      </div>
      <label class="field">
        <span data-i18n="admin.resetDay">每月重置日</span>
        <input type="number" id="f-reset-day" min="1" max="31" />
      </label>
      <label class="field">
        <span data-i18n="admin.quotaGb">流量配额 (GiB)</span>
        <input type="number" id="f-quota-gb" min="0" step="1" />
      </label>
      <label class="field">
        <span data-i18n="admin.expiresOn">到期日期</span>
        <input type="date" id="f-expires-on" />
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="admin.price">价格</span>
          <input type="number" id="f-price" min="0" step="0.01" />
        </label>
        <label class="field">
          <span data-i18n="admin.currency">币种</span>
          <select id="f-currency">
            <option value="">—</option>
            <option value="CNY">CNY ¥</option>
            <option value="USD">USD $</option>
            <option value="EUR">EUR €</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="admin.cycle">付费周期</span>
          <select id="f-cycle">
            <option value="">—</option>
            <option value="monthly" data-i18n="billing.cycle.monthly">月付</option>
            <option value="quarterly" data-i18n="billing.cycle.quarterly">季付</option>
            <option value="yearly" data-i18n="billing.cycle.yearly">年付</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span data-i18n="admin.bandwidth">带宽限制 (Mbps)</span>
        <input type="number" id="f-bandwidth" min="0" step="0.1" />
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="settings.trafficMode">流量统计模式</span>
          <select id="f-mode">
            <option value="bi" data-i18n="settings.modeBi">双向</option>
            <option value="uni" data-i18n="settings.modeUni">单向</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="settings.trafficDir">单向取值</span>
          <select id="f-dir">
            <option value="down" data-i18n="settings.dirDown">下行</option>
            <option value="up" data-i18n="settings.dirUp">上行</option>
            <option value="max" data-i18n="settings.dirMax">最大值</option>
          </select>
        </label>
      </div>
      <p class="modal-err" id="edit-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="edit-cancel" data-i18n="admin.cancel">取消</button>
        <button class="btn primary" id="edit-save" data-i18n="admin.save">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="at-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="host.addPingTask">添加延迟监控任务</h3>
        <button class="modal-x" data-close data-i18n-aria="common.close" aria-label="关闭">×</button>
      </div>
      <label class="field">
        <span data-i18n="pingTask.label">名称</span>
        <input id="at-label" type="text" />
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="pingTask.kind">类型</span>
          <select id="at-kind">
            <option value="icmp">ICMP</option>
            <option value="tcp" selected>TCP</option>
            <option value="http">HTTP</option>
          </select>
        </label>
        <label class="field" id="at-port-field">
          <span data-i18n="pingTask.port">端口</span>
          <input id="at-port" type="number" min="1" max="65535" value="443" />
        </label>
        <label class="field">
          <span data-i18n="pingTask.interval">间隔(秒)</span>
          <input id="at-interval" type="number" min="5" value="60" />
        </label>
      </div>
      <label class="field">
        <span data-i18n="pingTask.target">目标</span>
        <input id="at-target" type="text" placeholder="example.com / 1.1.1.1" data-i18n-placeholder="diag.targetPlaceholder" />
      </label>
      <p class="modal-err" id="at-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="at-cancel" data-i18n="admin.cancel">取消</button>
        <button class="btn primary" id="at-submit" data-i18n="common.add">添加</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="rename-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="admin.rename">修改主机名</h3>
        <button class="modal-x" data-close data-i18n-aria="common.close" aria-label="关闭">×</button>
      </div>
      <label class="field">
        <span data-i18n="admin.name">主机名</span>
        <input type="text" id="rename-input" autocomplete="off" />
      </label>
      <p class="modal-err" id="rename-err" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="rename-cancel" data-i18n="admin.cancel">取消</button>
        <button class="btn primary" id="rename-save" data-i18n="admin.save">保存</button>
      </div>
    </div>
  </div>

  <script src="common.js?v=0.4.1"></script>
  <script src="host.js?v=0.4.1"></script>
</body>
</html>
