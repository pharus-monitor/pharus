<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="doc.title.host">Pharus · Host</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 20.5 12h7Z' fill='%23fbbf24'/%3E%3Cpath d='M19.5 13h9L31 44H17Z' fill='none' stroke='%23fbbf24' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="nav-back" href="index.html" data-i18n="nav.hosts">← 主机列表</a>
      <div class="brand host-brand">
        <h1 id="host-name">—</h1>
        <p id="host-os">—</p>
      </div>
      <div class="header-right">
        <button id="theme-btn" class="view-toggle" type="button" data-i18n="theme.auto">auto</button>
        <a id="admin-link" class="admin-link" href="admin.html" hidden data-i18n="nav.admin">管理</a>
        <span id="conn" class="conn-badge conn-down" role="status">
          <span class="conn-dot"></span>Connecting…
        </span>
      </div>
    </div>
  </header>

  <main class="wrap main">

    <div id="host-card" class="host-card"></div>

    <section class="hw-panel" id="hw-panel" hidden>
      <div class="panel-head">
        <div>
          <h2 data-i18n="host.hardware">硬件信息</h2>
          <p data-i18n="host.hardwareSub">CPU、内存与系统概览</p>
        </div>
      </div>
      <div class="hw-grid" id="hw-grid"></div>
    </section>

    <div class="feature-grid" id="feature-grid">

      <section class="feature-panel" id="ping-panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="ping.title">延迟历史</h2>
            <p data-i18n="ping.subtitle">平均往返延迟与丢包趋势</p>
          </div>
        </div>
        <div class="panel-controls">
          <label class="field compact">
            <span data-i18n="ping.task">探测任务</span>
            <select id="ping-task"><option value="" data-i18n="ping.allTasks">全部任务</option></select>
          </label>
          <label class="field compact">
            <span data-i18n="common.range">时间范围</span>
            <select id="ping-range">
              <option value="1h" data-i18n="range.1h">1 小时</option>
              <option value="6h" data-i18n="range.6h">6 小时</option>
              <option value="24h" selected data-i18n="range.24h">24 小时</option>
              <option value="7d" data-i18n="range.7d">7 天</option>
            </select>
          </label>
        </div>
        <p class="panel-message" id="ping-message" role="status"></p>
        <div class="chart-wrap" id="ping-chart-wrap">
          <canvas id="ping-chart" role="img" data-i18n-aria="ping.chartAria" aria-label="延迟历史折线图"></canvas>
        </div>
        <div class="chart-legend" id="ping-legend"></div>
        <div class="loss-summary" id="ping-loss"></div>
      </section>

      <section class="feature-panel" id="diag-panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="diag.title">网络诊断</h2>
            <p data-i18n="diag.subtitle">Looking Glass 与 MTR 流式输出</p>
          </div>
        </div>
        <div class="panel-controls diag-controls">
          <label class="field compact target-field">
            <span data-i18n="diag.target">目标地址</span>
            <input id="diag-target" type="text" inputmode="url" placeholder="example.com / 1.1.1.1" data-i18n-placeholder="diag.targetPlaceholder" />
          </label>
          <label class="field compact cycles-field">
            <span data-i18n="diag.cycles">MTR 次数</span>
            <input id="diag-cycles" type="number" min="1" max="100" value="10" />
          </label>
        </div>
        <div class="panel-actions diag-actions">
          <button class="btn" id="diag-ping" type="button" data-i18n="diag.ping">Ping</button>
          <button class="btn" id="diag-traceroute" type="button" data-i18n="diag.traceroute">路由追踪</button>
          <button class="btn" id="diag-mtr" type="button" data-i18n="diag.mtr">MTR</button>
        </div>
        <p class="panel-message error" id="diag-error" role="alert" hidden></p>
        <div class="diag-sessions" id="diag-sessions"></div>
        <p class="panel-message" id="diag-empty" data-i18n="diag.empty">尚未运行诊断</p>
      </section>

      <section class="feature-panel feature-wide" id="streaming-panel">
        <div class="panel-head panel-head-inline">
          <div>
            <h2 data-i18n="streaming.title">流媒体检测</h2>
            <p data-i18n="streaming.subtitle">查看服务可用性与解锁状态</p>
          </div>
        </div>
        <p class="panel-message" id="streaming-message" role="status"></p>
        <div class="service-results" id="streaming-results"></div>
      </section>

    </div>
  </main>

  <template id="card-tpl">
    <article class="card is-offline">
      <div class="card-head">
        <div class="card-title">
          <h2 data-f="name">—</h2>
          <p data-f="os">—</p>
        </div>
        <div class="card-badges">
          <span class="region-pill" data-f="region" hidden></span>
          <span class="status-pill" data-f="status"><span class="dot"></span>Offline</span>
        </div>
      </div>

      <div class="card-body">
        <div class="gauge" role="img" data-i18n-aria="gauge.aria" aria-label="CPU usage">
          <svg viewBox="0 0 96 96" class="gauge-svg">
            <defs>
              <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f59e0b"/>
                <stop offset="1" stop-color="#fbbf24"/>
              </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="40" fill="none" stroke-width="7" class="gauge-track"/>
            <circle cx="48" cy="48" r="40" fill="none" stroke="url(#cpuGrad)" stroke-width="7"
                    stroke-linecap="round" class="gauge-arc" data-f="cpuArc"
                    stroke-dasharray="251.33" stroke-dashoffset="251.33"/>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" data-f="cpuVal">—</span>
            <span class="gauge-label" data-i18n="gauge.cpu">CPU</span>
          </div>
        </div>

        <div class="meters">
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.mem">Memory</span>
              <span class="meter-value" data-f="memVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill mem" data-f="memFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-head">
              <span class="meter-label" data-i18n="meter.disk">Disk</span>
              <span class="meter-value" data-f="diskVal">—</span>
            </div>
            <div class="meter-track"><div class="meter-fill disk" data-f="diskFill"></div></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="kv-grid">
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-down"><path d="M8 12.5 2.5 7h3V2h5v5h3z" fill="currentColor"/></svg>
            <span data-i18n="kv.download">Download</span>
          </span>
          <span class="v" data-f="rx">—</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg viewBox="0 0 16 16" class="ico ico-up"><path d="M8 3.5 13.5 9h-3v5h-5V9h-3z" fill="currentColor"/></svg>
            <span data-i18n="kv.upload">Upload</span>
          </span>
          <span class="v" data-f="tx">—</span>
        </div>
        <div class="kv"><span class="k" data-i18n="kv.load">Load</span><span class="v" data-f="load">—</span></div>
        <div class="kv"><span class="k" data-i18n="kv.uptime">Uptime</span><span class="v" data-f="uptime">—</span></div>
      </div>

      <div class="billing" data-f="billing" hidden>
        <div class="divider"></div>
        <div class="meter">
          <div class="meter-head">
            <span class="meter-label" data-i18n="billing.traffic">Cycle traffic</span>
            <span class="meter-value" data-f="trafficVal">—</span>
          </div>
          <div class="meter-track"><div class="meter-fill traffic" data-f="trafficFill"></div></div>
        </div>
        <div class="kv-grid billing-kv">
          <div class="kv"><span class="k" data-i18n="billing.expires">Expires</span><span class="v" data-f="expires">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.price">Price</span><span class="v" data-f="price">—</span></div>
          <div class="kv"><span class="k" data-i18n="billing.resetDay">Reset day</span><span class="v" data-f="resetDay">—</span></div>
        </div>
      </div>

      <div data-f="pingSection" hidden>
        <div class="divider"></div>
        <div class="mini-head"><span data-i18n="ping.current">当前延迟</span></div>
        <div class="result-chips" data-f="pings"></div>
      </div>

      <div data-f="unlockSection" hidden>
        <div class="divider"></div>
        <div class="mini-head"><span data-i18n="streaming.current">流媒体状态</span></div>
        <div class="result-chips" data-f="unlock"></div>
      </div>
    </article>
  </template>

  <script src="common.js"></script>
  <script src="host.js"></script>
</body>
</html>
